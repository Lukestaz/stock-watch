name: Consolidated verification service tests
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/multi-user-alerts']
    paths: ['worker/src/account-*.mjs', 'worker/test/account-*.test.mjs', 'worker/migrations/**', 'tests/schema/sqlite_d1_bridge.py', '.github/workflows/verification-service-tests.yml']
  pull_request:
    branches: [main]
    paths: ['worker/src/account-*.mjs', 'worker/test/account-*.test.mjs', 'worker/migrations/**', 'tests/schema/sqlite_d1_bridge.py', '.github/workflows/verification-service-tests.yml']
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check candidate service and Worker socket binding
        run: |
          node --check worker/src/account-gmail-verification-service.mjs
          node --check worker/src/account-gmail-socket-binding.mjs
      - name: Test SMTP protocol, durable controls and existing verification pipeline offline
        run: node --test worker/test/account-verification-service.test.mjs worker/test/account-budgeted-verification.test.mjs worker/test/account-verification-mail.test.mjs worker/test/account-alert-destination*.test.mjs
