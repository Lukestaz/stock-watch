name: Friends email dispatch tests
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/multi-user-alerts']
    paths: ['worker/src/account-*.mjs', 'worker/test/account-*.test.mjs', 'worker/migrations/**', 'tests/schema/sqlite_d1_bridge.py', '.github/workflows/friends-email-dispatch-tests.yml']
  pull_request:
    branches: [main]
    paths: ['worker/src/account-*.mjs', 'worker/test/account-*.test.mjs', 'worker/migrations/**', 'tests/schema/sqlite_d1_bridge.py', '.github/workflows/friends-email-dispatch-tests.yml']
permissions:
  contents: read
jobs:
  friends-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dispatcher, producer and verification suites without live provider access
        run: node --test worker/test/account-email-dispatch.test.mjs worker/test/account-alert-producer.test.mjs worker/test/account-gmail-assembled.test.mjs worker/test/account-verification-service.test.mjs worker/test/account-budgeted-verification.test.mjs worker/test/account-verification-mail.test.mjs worker/test/account-alert-destination*.test.mjs worker/test/account-alert-account-guard.test.mjs worker/test/account-alert-settings.test.mjs
