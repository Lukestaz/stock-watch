name: Verification mail adapter and budget tests
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/multi-user-alerts']
    paths: ['worker/migrations/**', 'worker/src/account-verification-*.mjs', 'worker/src/account-alert-destination*.mjs', 'worker/test/account-verification-mail.test.mjs', 'tests/schema/sqlite_d1_bridge.py', '.github/workflows/verification-mail-tests.yml']
  pull_request:
    branches: [main]
    paths: ['worker/migrations/**', 'worker/src/account-verification-*.mjs', 'worker/src/account-alert-destination*.mjs', 'worker/test/account-verification-mail.test.mjs', 'tests/schema/sqlite_d1_bridge.py', '.github/workflows/verification-mail-tests.yml']
permissions:
  contents: read
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test mail policy and atomic budgets with mocked delivery
        run: node --test worker/test/account-verification-mail.test.mjs worker/test/account-alert-destination*.test.mjs
