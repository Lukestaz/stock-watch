name: Publish legacy dashboard retirement notice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['legacy-pages/**', 'tests/legacy-pages.test.mjs', '.github/workflows/publish-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stock-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test local-only legacy snapshot exports
        run: node --test tests/legacy-pages.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-pages
      - name: Replace old dashboard with retirement notice only
        id: deployment
        uses: actions/deploy-pages@v4
