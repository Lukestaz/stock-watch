name: Inspect inline editor synthetic failures
on:
  workflow_dispatch:
  push:
    branches: ['feature/inline-targets-alert-consistency']
    paths: ['.github/workflows/inspect-inline-failures.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/feature/inline-targets-alert-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: dashboard-results-publisher
      cancel-in-progress: false
    steps:
      - name: Verify the source run identity
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const run = (await github.rest.actions.getWorkflowRun({owner,repo,run_id:40994016540})).data;
            if (run.head_sha !== '3b1c32128b2c8c795e0b41be0b952a955983debf' || run.head_branch !== 'feature/inline-targets-alert-consistency' || run.name !== 'Target editor and alert regression tests' || run.status !== 'completed') throw Error('Unexpected source run');
      - name: Download existing synthetic browser report; do not execute it
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '40994016540'
          name: target-editor-browser-results
          path: ${{ runner.temp }}/inline-failure-report
      - name: Publish bounded assertion diagnostics only
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/inline-failure-report/results.json
        with:
          script: |
            const fs = require('node:fs');
            const file = process.env.RESULT_FILE;
            if (fs.statSync(file).size > 5 * 1024 * 1024) throw Error('Oversized report');
            const report = JSON.parse(fs.readFileSync(file,'utf8'));
            if (!Array.isArray(report.suites)) throw Error('Invalid report');
            const clean = value => String(value || '').replace(/\u001b\[[0-9;]*m/g,'').replace(/(Bearer\s+)[\w.\-]+/gi,'$1[redacted]').slice(0,1800);
            const failures = [], queue = [...report.suites];
            let visited = 0;
            while (queue.length) {
              if (++visited > 10000) throw Error('Oversized suite tree');
              const suite = queue.pop();
              for (const spec of suite.specs || []) for (const test of spec.tests || []) {
                if (!['unexpected','flaky'].includes(test.status) || failures.length >= 20) continue;
                const errors = (test.results || []).flatMap(result => result.errors || (result.error ? [result.error] : [])).slice(0,3).map(error => clean(error.message));
                failures.push({browser:clean(test.projectName || test.projectId),title:clean(spec.title).slice(0,240),status:test.status,errors});
              }
              queue.push(...(suite.suites || []));
            }
            const summary = {schemaVersion:1,kind:'synthetic_browser_failure_diagnostics',sourceBranch:'feature/inline-targets-alert-consistency',testedCommit:'3b1c32128b2c8c795e0b41be0b952a955983debf',sourceRunId:'40994016540',sourceRunUrl:`${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/40994016540`,generatedAt:new Date().toISOString(),failures,reportErrors:(report.errors || []).slice(0,5).map(error => clean(error.message))};
            const {owner,repo} = context.repo;
            const path = 'targets/inline-targets-alert-consistency/diagnostics/40994016540.json';
            let sha;
            try { sha = (await github.rest.repos.getContent({owner,repo,path,ref:'ci-results'})).data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,branch:'ci-results',path,message:'Record synthetic browser failure diagnostics for run 40994016540',content:Buffer.from(JSON.stringify(summary,null,2)+'\n').toString('base64'),...(sha ? {sha} : {})});
            core.info(`Saved ${failures.length} bounded failure records for run 40994016540`);
