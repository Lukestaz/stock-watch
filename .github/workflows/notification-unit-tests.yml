name: Notification unit tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/notifications.py', 'scripts/notification_test.py', 'scripts/test_notifications_unit.py', 'scripts/monitor.py', 'tests/notifications/**', '.github/workflows/notification-unit-tests.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/notifications.py', 'scripts/notification_test.py', 'scripts/test_notifications_unit.py', 'scripts/monitor.py', 'tests/notifications/**', '.github/workflows/notification-unit-tests.yml']
permissions:
  contents: read
concurrency:
  group: notification-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mocked tests and syntax check; no sending
        run: python tests/notifications/run_unit_tests.py --output "$RUNNER_TEMP/notification-unit-results.json"
      - name: Upload unit-test counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: notification-unit-results
          path: ${{ runner.temp }}/notification-unit-results.json
          retention-days: 7
          if-no-files-found: warn
  publish-unit-summary:
    needs: unit-tests
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: dashboard-results-publisher
      cancel-in-progress: false
    steps:
      - name: Download this run's unit-test data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: notification-unit-results
          path: ${{ runner.temp }}/notification-unit-results
      - name: Save allowlisted unit-test summary
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/notification-unit-results/notification-unit-results.json
          TEST_JOB_RESULT: ${{ needs.unit-tests.result }}
        with:
          script: |
            const fs = require('node:fs');
            let raw = null, reportState = 'missing';
            try {
              if (fs.statSync(process.env.RESULT_FILE).size > 32000) throw Error('Oversized result');
              raw = JSON.parse(fs.readFileSync(process.env.RESULT_FILE,'utf8'));
              const c = raw.counts;
              if (raw.kind !== 'notification_unit_tests' || raw.runId !== String(context.runId) || raw.runAttempt !== process.env.GITHUB_RUN_ATTEMPT || raw.testedCommit !== context.sha) throw Error('Wrong report identity');
              if (!c || !['total','passed','failed','skipped','expectedFailures'].every(k => Number.isSafeInteger(c[k]) && c[k] >= 0)) throw Error('Invalid counts');
              if (c.total !== c.passed+c.failed+c.skipped+c.expectedFailures || !['passed','failed'].includes(raw.monitorSyntax)) throw Error('Invalid totals or syntax status');
              reportState = 'available';
            } catch (e) { raw = null; reportState = e.code === 'ENOENT' ? 'missing' : 'invalid'; }
            const jobResult = process.env.TEST_JOB_RESULT;
            const counts = raw ? Object.fromEntries(['total','passed','failed','skipped','expectedFailures'].map(k => [k,raw.counts[k]])) : null;
            const passed = jobResult === 'success' && counts && counts.total > 0 && counts.failed === 0 && raw.monitorSyntax === 'passed';
            const outcome = passed ? 'passed' : jobResult === 'failure' || raw ? 'failed' : 'unverified';
            const failures = raw && Array.isArray(raw.failures) ? raw.failures.slice(0,20).map(f => ({test:String(f.test || '').slice(0,200),kind:['assertion_failure','test_error','unexpected_success'].includes(f.kind) ? f.kind : 'test_error'})) : [];
            const summary = {schemaVersion:1,kind:'notification_unit_tests',workflow:'Notification unit tests',sourceBranch:'main',testedCommit:context.sha,runId:String(context.runId),runNumber:process.env.GITHUB_RUN_NUMBER,runAttempt:process.env.GITHUB_RUN_ATTEMPT,runUrl:`${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,generatedAt:new Date().toISOString(),jobResult,outcome,reportState,counts,monitorSyntax:raw ? raw.monitorSyntax : 'unverified',failures,liveMessagesSent:false};
            const content = JSON.stringify(summary,null,2)+'\n';
            const {owner,repo} = context.repo;
            let head = null, baseTree;
            try {
              head = (await github.rest.git.getRef({owner,repo,ref:'heads/ci-results'})).data.object.sha;
              baseTree = (await github.rest.git.getCommit({owner,repo,commit_sha:head})).data.tree.sha;
            } catch (e) { if(e.status !== 404) throw e; }
            let replaceLatest = true;
            if (head) {
              try {
                const file = (await github.rest.repos.getContent({owner,repo,path:'notifications/unit/latest.json',ref:head})).data;
                const old = JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));
                replaceLatest = Number(summary.runNumber) > Number(old.runNumber) || (Number(summary.runNumber) === Number(old.runNumber) && Number(summary.runAttempt) >= Number(old.runAttempt));
              } catch (e) { if(e.status !== 404) throw e; }
            }
            const entries = [{path:`notifications/unit/runs/${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}.json`,mode:'100644',type:'blob',content}];
            if(replaceLatest) entries.push({path:'notifications/unit/latest.json',mode:'100644',type:'blob',content});
            const tree = (await github.rest.git.createTree({owner,repo,...(baseTree ? {base_tree:baseTree} : {}),tree:entries})).data;
            const commit = (await github.rest.git.createCommit({owner,repo,message:`Notification unit CI ${context.runId}: ${outcome}`,tree:tree.sha,parents:head ? [head] : []})).data;
            if(head) await github.rest.git.updateRef({owner,repo,ref:'heads/ci-results',sha:commit.sha,force:false});
            else await github.rest.git.createRef({owner,repo,ref:'refs/heads/ci-results',sha:commit.sha});
            await core.summary.addHeading('Notification unit tests').addRaw(`Outcome: ${outcome}; job: ${jobResult}; report: ${reportState}. No live messages sent.\n`).write();
