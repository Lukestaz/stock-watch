name: Discover Simplicity preview metadata
on:
  push:
    branches: [feat/simplicity-preview-release]
    paths:
      - '.github/workflows/simplicity-preview-discovery.yml'
      - 'scripts/simplicity-discovery.mjs'
      - 'worker/test/simplicity-discovery.test.mjs'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Lukestaz/stock-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test metadata-only discovery using synthetic responses
        run: node --test worker/test/simplicity-discovery.test.mjs
      - name: Read Cloudflare inventory without SQL or mutations
        id: inventory
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OUTCOME_FILE: ${{ runner.temp }}/simplicity-discovery.json
        run: node scripts/simplicity-discovery.mjs
      - name: Preserve filtered metadata even when incomplete
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: simplicity-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simplicity-discovery.json
          retention-days: 1
          if-no-files-found: warn
      - name: Fail inspection if metadata could not be fully read
        if: ${{ !cancelled() && steps.inventory.outcome != 'success' }}
        run: exit 1
  publish:
    needs: inspect
    if: >-
      always() && !cancelled() && github.repository == 'Lukestaz/stock-watch' &&
      github.event_name == 'push' && github.ref == 'refs/heads/feat/simplicity-preview-release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: simplicity-discovery-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simplicity-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simplicity-discovery
      - uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ runner.temp }}/simplicity-discovery/simplicity-discovery.json
        with:
          script: |
            const text = require('node:fs').readFileSync(process.env.REPORT_FILE, 'utf8');
            const report = JSON.parse(text);
            if (report.sourceSha !== process.env.GITHUB_SHA || report.runId !== process.env.GITHUB_RUN_ID || report.runAttempt !== process.env.GITHUB_RUN_ATTEMPT || !/^\d+$/.test(report.runId) || !/^\d+$/.test(report.runAttempt) || report.isolationVerified !== false || report.mutationsRequested !== false || report.sqlExecuted !== false) throw Error('Discovery metadata mismatch');
            const {owner, repo} = context.repo;
            const read = async (path, ref) => {
              try { const data = (await github.rest.repos.getContent({owner, repo, path, ref})).data; return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')); }
              catch (e) { if (e.status === 404) return null; throw e; }
            };
            const newer = (a,b) => Number(a.runNumber) > Number(b.runNumber) || (Number(a.runNumber) === Number(b.runNumber) && Number(a.runAttempt) > Number(b.runAttempt));
            for (let attempt = 0; attempt < 4; attempt++) {
              const head = (await github.rest.git.getRef({owner, repo, ref:'heads/ci-results'})).data.object.sha;
              const runPath = `simplicity-release/discovery/runs/${report.runId}-${report.runAttempt}.json`;
              if (await read(runPath, head)) return;
              const base = (await github.rest.git.getCommit({owner, repo, commit_sha:head})).data.tree.sha;
              const entry = path => ({path, mode:'100644', type:'blob', content:text});
              const entries = [entry(runPath)];
              const old = await read('simplicity-release/discovery/latest.json', head);
              if (!old || newer(report, old)) entries.push(entry('simplicity-release/discovery/latest.json'));
              const tree = (await github.rest.git.createTree({owner, repo, base_tree:base, tree:entries})).data;
              const commit = (await github.rest.git.createCommit({owner, repo, message:`Simplicity discovery ${report.runId}/${report.runAttempt}: ${report.complete ? 'metadata-read-complete' : 'incomplete'}`, tree:tree.sha, parents:[head]})).data;
              try { await github.rest.git.updateRef({owner, repo, ref:'heads/ci-results', sha:commit.sha, force:false}); core.info(`Saved filtered metadata at ${commit.sha}`); return; }
              catch (e) { if (![409,422].includes(e.status) || attempt === 3) throw e; }
            }
