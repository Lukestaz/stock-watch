name: Deploy Stock Watch frontend preview
on:
  push:
    branches: [feature/account-watchlist-sync]
    paths: ['.github/workflows/deploy-app.yml', 'site/**', 'worker/src/account-*.mjs', 'worker/test/account-*.test.mjs', 'worker/wrangler.d1.jsonc']
permissions:
  contents: read
concurrency:
  group: deploy-stock-watch-app
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c4814713eafd41ae857b9a8097610df6
      WRANGLER_SEND_METRICS: 'false'
      APP_URL: https://stock-watch-app.lukestaz.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require account regression tests before deployment
        run: |
          node --test worker/test/account-*.test.mjs
          node --check site/account-signin.js
      - name: Build Google account preview with existing D1
        run: |
          set -euo pipefail
          export APP_DIR="$RUNNER_TEMP/stock-watch-app"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          p=Path(os.environ['APP_DIR']);p.mkdir(parents=True,exist_ok=True)
          shutil.copytree('site',p/'static',dirs_exist_ok=True)
          shutil.copytree('worker/src',p/'src',dirs_exist_ok=True)
          f=p/'static/market-data.js';s=f.read_text();old='https://stock-watch-prices.lukestaz.workers.dev';assert old in s;f.write_text(s.replace(old,'/api'))
          f=p/'static/index.html';s=f.read_text();m='<main id="cards">';assert m in s;f.write_text(s.replace(m,'<p role="status">Account preview: Google sign-in is enabled. Targets still save on this device only; cloud sync and account alerts are not enabled.</p>'+m,1))
          d=json.loads(Path('worker/wrangler.d1.jsonc').read_text());b=d['d1_databases'];assert d['name']=='stock-watch-app' and len(b)==1 and b[0]['binding']=='DB' and b[0]['database_name']=='stock-watch' and b[0]['database_id']=='4cb54afc-8f2d-4f62-8b6b-7d59f343b938'
          (p/'wrangler.jsonc').write_text(json.dumps({'name':'stock-watch-app','main':'src/account-runtime.mjs','compatibility_date':'2026-10-19','workers_dev':True,'preview_urls':False,'d1_databases':[{k:b[0][k] for k in ('binding','database_name','database_id')}],'vars':{'ACCOUNTS_ENABLED':'true','APP_ORIGIN':os.environ['APP_URL'],'GOOGLE_CLIENT_ID':'19866673111-hg5958bvoiqoa5crrt0jmalvh1mssfvk.apps.googleusercontent.com'},'ratelimits':[{'name':'ACCOUNT_LIMIT','namespace_id':'1986667311','simple':{'limit':30,'period':60}}],'assets':{'directory':'./static','binding':'ASSETS','run_worker_first':True},'services':[{'binding':'PRICES','service':'stock-watch-prices'}]}))
          PY
          node --check "$APP_DIR/src/account-runtime.mjs"
      - name: Require the explicitly provisioned app Worker
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/stock-watch-app")
          echo "Worker existence check HTTP: $status"
          test "$status" = 200
      - name: Check existing account schema without reading private rows
        run: |
          set -euo pipefail
          npx --yes wrangler@4.150.0 d1 execute DB --remote --config "$APP_DIR/wrangler.jsonc" --command "PRAGMA table_info(users); PRAGMA table_info(watchlists); PRAGMA table_info(watchlist_entries); PRAGMA table_info(login_challenges); PRAGMA table_info(sessions); SELECT name, type FROM sqlite_schema WHERE name IN ('watchlist_entries_order','watchlist_entries_limit_insert','watchlist_entries_limit_move','login_challenges_expiry','sessions_user','sessions_expiry');" --json > "$RUNNER_TEMP/account-schema.json"
          node <<'JS'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const reports = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/account-schema.json', 'utf8'));
          assert.ok(Array.isArray(reports) && reports.length === 6, 'Unexpected schema metadata response');
          const tables = {
            users: ['id','google_sub','created_at'],
            watchlists: ['user_id','revision','monitor_applied_revision','updated_at','write_token'],
            watchlist_entries: ['user_id','symbol','target_usd','position','alerts_enabled','email_enabled','whatsapp_enabled','target_revision','updated_at'],
            login_challenges: ['challenge_hash','created_at','expires_at','used_by'],
            sessions: ['token_hash','user_id','created_at','last_seen_at','expires_at']
          };
          let failed = false;
          for (const [i,[table,required]] of Object.entries(tables).entries()) {
            const columns = new Set((reports[i].results || []).map(c => c.name));
            const missing = required.filter(c => !columns.has(c));
            const passed = reports[i].success === true && missing.length === 0;
            console.log(JSON.stringify({check:'account-table',table,passed,missing}));
            if (!passed) failed = true;
          }
          const objects = new Map((reports[5].results || []).map(o => [o.name,o.type]));
          for (const [name,type] of Object.entries({watchlist_entries_order:'index',watchlist_entries_limit_insert:'trigger',watchlist_entries_limit_move:'trigger',login_challenges_expiry:'index',sessions_user:'index',sessions_expiry:'index'})) {
            const passed = reports[5].success === true && objects.get(name) === type;
            console.log(JSON.stringify({check:'account-schema-object',name,type,passed}));
            if (!passed) failed = true;
          }
          assert.ok(!failed, 'Account schema incomplete; no migrations were applied');
          JS
      - name: Deploy Google account preview
        run: npx --yes wrangler@4.150.0 deploy --config "$APP_DIR/wrangler.jsonc" --var "BUILD_SHA:$GITHUB_SHA"
      - name: Verify revision, frontend, anonymous isolation and origin rejection
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const origin = process.env.APP_URL;
          let failed = false;
          function check(name, passed) { console.log(JSON.stringify({check:name,passed})); if (!passed) failed = true; }
          const get = (path, options = {}) => fetch(origin + path, {redirect:'error',signal:AbortSignal.timeout(20000),...options});
          let healthPassed = false;
          for (let i = 0; i < 6; i++) {
            try {
              const r = await get('/api/health'), h = await r.json();
              healthPassed = r.ok && h.ok === true && h.build === process.env.GITHUB_SHA && h.mode === 'account-preview' && h.database?.bound === true && h.database?.ready === true;
              if (healthPassed) break;
            } catch {}
            if (i < 5) await new Promise(resolve => setTimeout(resolve,5000));
          }
          check('health-build-account-mode-database',healthPassed);
          try {
            const r = await get('/'), html = await r.text();
            check('frontend-signin-and-preview-notice',r.ok && html.includes('./account-signin.js') && html.includes('Account preview: Google sign-in is enabled.'));
            const script = await get('/account-signin.js');
            check('signin-script',script.ok && (await script.text()).includes('19866673111-hg5958bvoiqoa5crrt0jmalvh1mssfvk.apps.googleusercontent.com'));
          } catch { check('frontend-request',false); }
          try {
            const r = await get('/api/v1/watchlist',{headers:{'Sec-Fetch-Site':'same-origin'}});
            check('anonymous-watchlist-denied',r.status === 401);
            check('anonymous-no-cookie',!r.headers.has('set-cookie'));
            const unsafe = await get('/api/v1/auth/start',{method:'POST',headers:{Origin:'https://example.com','Sec-Fetch-Site':'cross-site','Content-Type':'application/json'},body:'{}'});
            check('cross-origin-login-denied',unsafe.status === 403 && !unsafe.headers.has('set-cookie'));
          } catch { check('account-route-request',false); }
          if (failed) { console.error('Verification failed. No automatic rollback was performed.'); process.exit(1); }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Verified Google account preview at ${origin}, build ${process.env.GITHUB_SHA}. No migrations, watchlist sync, or account alerts enabled. Real Google login still requires browser verification.\n`);
          JS
