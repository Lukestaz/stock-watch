name: Deploy Stock Watch app
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY stock-watch-app e977e9e ALERTS-OFF'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-stock-watch-app
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: e977e9e0dcb44708fa9cdf1199ce69a8ea6e02a6
      APP_URL: https://stock-watch-app.lukestaz.workers.dev
      APP_DIR: ${{ runner.temp }}/stock-watch-app-release
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require exact manual deployment confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'DEPLOY stock-watch-app e977e9e ALERTS-OFF'
      - uses: actions/checkout@v4
        with:
          ref: e977e9e0dcb44708fa9cdf1199ce69a8ea6e02a6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require pinned account and legacy regressions
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node --test worker/test/account-*.test.mjs tests/legacy-pages.test.mjs
          node --check site/account-signin.js
      - name: Build exact production configuration without migrations or provider setup
        run: |
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          p=Path(os.environ['APP_DIR'])
          p.mkdir()
          shutil.copytree('site',p/'static')
          shutil.copytree('worker/src',p/'src')
          f=p/'static/market-data.js'
          source=f.read_text()
          old='https://stock-watch-prices.lukestaz.workers.dev'
          assert old in source
          f.write_text(source.replace(old,'/api'))
          source_config=json.loads(Path('worker/wrangler.d1.jsonc').read_text())
          bindings=source_config['d1_databases']
          assert source_config['name']=='stock-watch-app' and len(bindings)==1
          assert bindings[0]['binding']=='DB' and bindings[0]['database_name']=='stock-watch' and bindings[0]['database_id']=='4cb54afc-8f2d-4f62-8b6b-7d59f343b938'
          config={'name':'stock-watch-app','main':'src/account-runtime.mjs','compatibility_date':'2026-10-19','workers_dev':True,'preview_urls':False,
            'd1_databases':[{k:bindings[0][k] for k in ['binding','database_name','database_id']}],
            'vars':{'ACCOUNTS_ENABLED':'true','APP_ORIGIN':os.environ['APP_URL'],'GOOGLE_CLIENT_ID':'19866673111-hg5958bvoiqoa5crrt0jmalvh1mssfvk.apps.googleusercontent.com','BUILD_SHA':os.environ['RELEASE_SHA'],'FRIENDS_ALERTS_ENABLED':'false','FRIENDS_ENROLLMENT_ENABLED':'false','FRIENDS_SCHEDULE_ENABLED':'false'},
            'ratelimits':[{'name':'ACCOUNT_LIMIT','namespace_id':'1986667311','simple':{'limit':30,'period':60}}],
            'assets':{'directory':'./static','binding':'ASSETS','run_worker_first':True},
            'services':[{'binding':'PRICES','service':'stock-watch-prices'}],'triggers':{'crons':[]}}
          (p/'wrangler.jsonc').write_text(json.dumps(config,indent=2)+'\n')
          PY
          node --check "$APP_DIR/src/account-runtime.mjs"
      - name: Record current build and refuse unexpected enabled-alert state
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const r=await fetch(process.env.APP_URL+'/api/health',{redirect:'error',signal:AbortSignal.timeout(20000)});
          assert.equal(r.ok,true,'Existing health unavailable; no deployment attempted');
          const h=await r.json();
          assert.equal(h.ok,true);
          assert.equal(h.mode,'account-preview');
          assert.equal(h.database?.bound,true);
          assert.equal(h.database?.ready,true);
          assert.match(h.build||'',/^[a-f0-9]{40}$/);
          assert.ok(!h.friendsAlerts?.verificationReady&&!h.friendsAlerts?.enrollmentAvailable&&!h.friendsAlerts?.scheduledConfigured,'Unexpected enabled feature state; stop for review');
          writeFileSync(process.env.APP_DIR+'/predeployment-health.json',JSON.stringify({checkedAt:new Date().toISOString(),previousBuild:h.build,release:process.env.RELEASE_SHA,mode:h.mode,database:h.database},null,2));
          JS
      - name: Preserve predeployment build metadata
        uses: actions/upload-artifact@v4
        with:
          name: stock-watch-predeployment-${{ github.run_id }}
          path: ${{ env.APP_DIR }}/predeployment-health.json
          retention-days: 7
          if-no-files-found: error
      - name: Require existing Worker and migrated production schema without private rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c4814713eafd41ae857b9a8097610df6
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/stock-watch-app")
          test "$status" = 200
          python3 - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          p=Path(os.environ['APP_DIR'])
          tables=['users','watchlists','watchlist_entries','login_challenges','sessions','price_cache_entries','price_cache_budget','alert_destinations','alert_email_challenges','account_alert_monitors','account_alert_events','account_alert_deliveries','verification_request_attempts','verification_mail_reservations']
          sql="SELECT name FROM d1_migrations ORDER BY name; SELECT name,type FROM sqlite_schema; PRAGMA table_info(account_alert_deliveries); PRAGMA table_info(verification_mail_reservations);"
          r=subprocess.run(['npx','--yes','wrangler@4.150.0','d1','execute','DB','--remote','--config',str(p/'wrangler.jsonc'),'--command',sql,'--json'],capture_output=True,text=True,timeout=180)
          try:
              assert r.returncode==0
              reports=json.loads(r.stdout)
              assert len(reports)==4 and all(x.get('success') is True for x in reports)
              expected=sorted(x.name for x in Path('worker/migrations').glob('*.sql'))
              assert [x['name'] for x in reports[0]['results']]==expected
              actual={x['name'] for x in reports[1]['results'] if x['type']=='table'}
              assert set(tables)<=actual
              assert {'consent_revision','claim_token','claim_until','dispatch_token','send_started_at','last_error_category'}<={x['name'] for x in reports[2]['results']}
              assert 'purpose' in {x['name'] for x in reports[3]['results']}
          except Exception:
              sys.exit('Schema preflight failed. No deployment or migrations performed; raw provider errors suppressed.')
          PY
      - name: Deploy pinned app with all friends-alert flags false and no app cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c4814713eafd41ae857b9a8097610df6
        run: npx --yes wrangler@4.150.0 deploy --config "$APP_DIR/wrangler.jsonc"
      - name: Verify deployed revision, assets and disabled alert routes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          const get=path=>fetch(process.env.APP_URL+path,{redirect:'error',signal:AbortSignal.timeout(20000)});
          let passed=false;
          for(let i=0;i<6;i++){
            try{
              const r=await get('/api/health'),h=await r.json();
              passed=r.ok&&h.ok===true&&h.build===process.env.RELEASE_SHA&&h.mode==='account-preview'&&h.database?.bound===true&&h.database?.ready===true&&!h.friendsAlerts?.verificationReady&&!h.friendsAlerts?.enrollmentAvailable&&!h.friendsAlerts?.scheduledConfigured;
              if(passed)break;
            }catch{}
            if(i<5)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          assert.ok(passed,'Postdeployment health mismatch. No automatic rollback was performed.');
          for(const path of ['/','/account-signin.js','/account-alert-settings.mjs','/account-friends-email.mjs'])assert.ok((await get(path)).ok,'Asset unavailable: '+path);
          for(const path of ['/api/v1/alert-destination/email','/api/v1/alert-destination/email/verify','/api/v1/alert-consent/email'])assert.equal((await get(path)).status,503,'Alert route unexpectedly enabled');
          assert.equal((await get('/api/v1/watchlist')).status,401);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Deployed and verified '+process.env.RELEASE_SHA+' to stock-watch-app. Existing migrated D1 retained. Verification, enrolment and schedule flags false; app cron empty. No migrations, provider-secret changes or email sends. Automatic app deployment is paused pending a reviewed release policy. This is validation bootstrap, not usable-alert activation.\n');
          JS
